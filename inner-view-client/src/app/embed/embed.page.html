<ion-content>
  @if (tour && tour.panoramas.length > 0) {
    <app-panoramic-viewer [panoramas]="tour.panoramas"></app-panoramic-viewer>
  }
  @if (!tour && !loadError) {
    <div class="embed-state">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  }
  @if (loadError) {
    <div class="embed-state">
      <p>Tour virtual não encontrado.</p>
    </div>
  }
</ion-content>
