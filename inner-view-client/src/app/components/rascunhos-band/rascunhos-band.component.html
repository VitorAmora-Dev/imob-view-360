<!--
  Sem título de seção: quem tem título é a página. Enquanto isto era uma faixa
  no topo da home, o `<h2>` existia para dizer de que era aquele bloco no meio
  do catálogo — aqui a tela inteira já responde isso.
-->
@if (rascunhos().length) {
  <section class="rascunhos">
    <ul class="rascunhos__lista">
      @for (r of rascunhos(); track r.id) {
        <li class="rascunhos__card">
          <button type="button" class="rascunhos__abrir" (click)="retomar(r)">
            <span class="rascunhos__thumb">
              <!--
                Só desenha o <img> quando a miniatura já chegou. O rascunho
                sem cômodo nenhum é estado normal — existe entre criar o
                rascunho e a primeira captura terminar — e um <img> com src
                vazio desenharia o ícone de imagem quebrada no lugar dela.
              -->
              @if (r.miniatura) {
                <img [src]="r.miniatura" alt="" />
              }
            </span>

            <span class="rascunhos__info">
              <span class="rascunhos__ambientes">
                @if (r.ambientes) {
                  {{ 'HOME.DRAFTS_ROOMS' | translate: { count: r.ambientes } }}
                } @else {
                  {{ 'HOME.DRAFTS_EMPTY_ROOMS' | translate }}
                }
              </span>
              <span class="rascunhos__data">{{ r.updatedAt | date: 'short' }}</span>
              <span class="rascunhos__continuar">{{ 'HOME.DRAFTS_RESUME' | translate }}</span>
            </span>
          </button>

          <button type="button" class="rascunhos__descartar" (click)="descartar(r)">
            {{ 'HOME.DRAFTS_DISCARD' | translate }}
          </button>
        </li>
      }
    </ul>
  </section>
} @else {
  <!--
    Quem foi até a aba procurar merece uma resposta, e não uma tela em branco.
    Na faixa da home a mesma lista vazia não desenhava nada — ali ela disputava
    o topo com o catálogo, e uma seção vazia seria ruído permanente.
  -->
  <section class="rascunhos rascunhos--vazio">
    <h2 class="rascunhos__vazio-titulo">{{ 'DRAFTS.EMPTY_TITLE' | translate }}</h2>
    <p class="rascunhos__vazio-dica">{{ 'DRAFTS.EMPTY_HINT' | translate }}</p>
    <a class="rascunhos__vazio-cta" routerLink="/tour/novo">
      {{ 'DRAFTS.EMPTY_CTA' | translate }}
    </a>
  </section>
}

<!--
  Fora do `@if` de propósito: com o último rascunho descartado a seção inteira
  deixa de existir, e o diálogo iria embora no meio da própria animação de
  saída. Aqui ele sobrevive ao cartão que o abriu.
-->
<app-tw-wizard-dialog
  [pergunta]="dialogo.pergunta()"
  (escolheu)="dialogo.escolher($event)"
  (dispensou)="dialogo.dispensar($event)" />
