<header
  class="app-header"
  [class.app-header--scrolled]="scrolled()"
  [class.app-header--overlay]="variant === 'overlay'">
  <nav class="header-nav">
    <div class="header-lead">
      @if (backHref) {
        <button type="button" class="back-btn" (click)="goBack()" [attr.aria-label]="'NAV.BACK' | translate">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </button>
      }
      <a
        class="brand-link"
        routerLink="/home"
        aria-label="ARP VISION — início">
        <app-brand-logo
          kind="horizontal"
          [tone]="variant === 'overlay' ? 'white' : 'blue'"
          [decorative]="true">
        </app-brand-logo>
      </a>
      @if (pageTitle) {
        <span class="page-title">{{ pageTitle }}</span>
      }
    </div>

    <!-- Page-specific actions (e.g. the 360 viewer toolbar) -->
    <div class="header-slot">
      <ng-content select="[headerActions]"></ng-content>
    </div>

    @if (isAuthenticated()) {
      <div class="header-desktop">
        @for (link of links; track link.href) {
          <a
            class="nav-link"
            [routerLink]="link.href"
            routerLinkActive="nav-link--active"
            [routerLinkActiveOptions]="{ exact: true }">
            {{ link.labelKey | translate }}
          </a>
        }

        <div class="header-divider"></div>

        <button
          type="button"
          class="circle-control icon-action"
          (click)="openLanguagePopover($event)"
          [attr.aria-label]="'NAV.LANGUAGE' | translate">
          <ion-icon name="globe-outline"></ion-icon>
        </button>
        <a class="circle-control icon-action" routerLink="/profile" [attr.aria-label]="'PROFILE.TITLE' | translate">
          <ion-icon name="person-circle-outline"></ion-icon>
        </a>
        <button type="button" class="circle-control icon-action" (click)="signout()" [attr.aria-label]="'NAV.SIGNOUT' | translate">
          <ion-icon name="log-out-outline"></ion-icon>
        </button>
      </div>

      <!--
        A engrenagem é o `.header-desktop` do telefone, e só isso: abaixo de
        744px aquele bloco é `display: none`, e com ele somem idioma, perfil e
        sair. Ela leva à tela que reúne os três. Os dois nunca aparecem juntos
        — o mesmo @media governa quem entra e quem sai.

        Aqui, e não numa quarta aba da barra de baixo: configuração é destino
        de visita rara, e o rodapé é o espaço dos destinos de todo dia.
      -->
      <a
        class="circle-control icon-action header-config"
        routerLink="/configuracoes"
        [attr.aria-label]="'SETTINGS.TITLE' | translate">
        <ion-icon name="settings-outline"></ion-icon>
      </a>
    }
  </nav>

</header>

<ion-popover
  [isOpen]="isLangPopoverOpen"
  [event]="langPopoverEvent"
  (didDismiss)="isLangPopoverOpen = false">
  <ng-template>
    <ion-list lines="none">
      <ion-item button [detail]="false" (click)="selectLang('pt')">
        <ion-label>Português</ion-label>
        @if (languageService.currentLang() === 'pt') {
          <ion-icon name="checkmark-outline" slot="end"></ion-icon>
        }
      </ion-item>
      <ion-item button [detail]="false" (click)="selectLang('en')">
        <ion-label>English</ion-label>
        @if (languageService.currentLang() === 'en') {
          <ion-icon name="checkmark-outline" slot="end"></ion-icon>
        }
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>
