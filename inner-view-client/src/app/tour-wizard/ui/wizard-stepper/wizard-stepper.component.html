<!--
  `role="list"` explícito num <ol> parece redundante, mas não é: quando o CSS
  remove os marcadores (`list-style: none`), o Safari descarta a semântica de
  lista e o VoiceOver deixa de anunciar "lista de 3 itens". O papel explícito a
  devolve.
-->
<ol class="tw-chips" role="list">
  @for (n of steps; track n) {
    <li>
      <button
        type="button"
        class="tw-chip"
        [attr.data-state]="stateOf(n)"
        [attr.aria-current]="stateOf(n) === 'current' ? 'step' : null"
        [attr.aria-disabled]="stateOf(n) === 'blocked' ? 'true' : null"
        (click)="onChip(n)">
        <span class="tw-chip__dot" aria-hidden="true">
          {{ stateOf(n) === 'done' ? '✓' : n }}
        </span>
        <span class="tw-chip__label">
          {{ 'TOUR_WIZARD.COMMON.STEP_' + n | translate }}
        </span>
      </button>
    </li>
  }
</ol>

<!--
  O valor lido em voz alta é "Etapa 2 de 3", não "2" — `aria-valuetext` existe
  para isso, e sem ele o leitor de tela anuncia um número solto sem unidade.
-->
<div
  class="tw-progress"
  role="progressbar"
  [attr.aria-valuenow]="store.step()"
  aria-valuemin="1"
  aria-valuemax="3"
  [attr.aria-valuetext]="'TOUR_WIZARD.COMMON.STEP_OF' | translate: { step: store.step() }">
  <div class="tw-progress__fill" [style.width.%]="store.progressPct()"></div>
</div>

<p class="tw-progress__meta">
  <span>{{ 'TOUR_WIZARD.COMMON.STEP_OF' | translate: { step: store.step() } }}</span>
  <span>{{ 'TOUR_WIZARD.COMMON.HINT_' + store.step() | translate }}</span>
</p>
