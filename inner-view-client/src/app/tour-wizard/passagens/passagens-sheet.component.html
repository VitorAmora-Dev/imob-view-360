<div class="ps">
  <div class="ps__cabecalho">
    <p class="ps__progresso">
      {{
        'TOUR_WIZARD.PASSAGES.PROGRESS'
          | translate: { feitas: feitas(), total: total() }
      }}
    </p>

    @if (temPonto()) {
      <button type="button" class="ps__refazer" (click)="refazer.emit()">
        {{ 'TOUR_WIZARD.PASSAGES.REDO' | translate }}
      </button>
    }
  </div>

  <!--
    As que ainda faltam NESTA foto. Some quando nao falta mais nenhuma: uma
    lista vazia com titulo ocuparia altura para dizer que nao ha o que dizer.
  -->
  @if (pendentes().length) {
    <p class="ps__pendentes">
      <span class="ps__pendentes-rotulo">
        {{ 'TOUR_WIZARD.PASSAGES.ALSO_HERE' | translate }}
      </span>
      @for (p of pendentes(); track p.destino.id) {
        <span class="ps__chip">{{ nome(p.destino) }}</span>
      }
    </p>
  }

  <!--
    Em tela cheia a barra do wizard some, e com ela o "Voltar". Sem este botao
    o corretor fica preso na etapa de passagens sem caminho de volta.
  -->
  <!--
    So o voltar. O confirmar saiu daqui para dentro do palco (ver
    `.sp__confirmar` na etapa): abaixo da foto ele ficava fora de vista no
    celular, e confirmar exigia rolar a tela no meio do gesto.
  -->
  <div class="ps__acoes">
    <button type="button" class="ps__voltar" (click)="voltar.emit()">
      {{ 'TOUR_WIZARD.PASSAGES.BACK' | translate }}
    </button>
  </div>
</div>
