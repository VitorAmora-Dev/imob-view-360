<ion-content [fullscreen]="true" [scrollEvents]="true" (ionScroll)="onScroll($event)">
  <app-header backHref="/home" [pageTitle]="'TOUR_WIZARD.COMMON.TITLE' | translate"></app-header>

  <!--
    `is-imersivo` na etapa de passagens: no celular a foto ocupa a tela, e o
    stepper e a barra de acao somem. O caminho de volta a ordenacao passa a ser
    o botao da propria gaveta -- ver `passagens-sheet`.
  -->
  <div class="tw-shell" [class.is-imersivo]="store.step() === 3 && !store.published()">
    <app-wizard-stepper />

    <div class="tw-body">
      <!--
        Não existe mais tela de espera da montagem por IA aqui.
        Ela cobria o wizard inteiro por cerca de um minuto por ambiente, no
        instante em que o corretor apertava "criar tour". Agora a montagem
        dispara na confirmação de cada captura e roda enquanto ele fotografa os
        outros cômodos, então no publicar não sobra o que esperar — e o que
        ainda estiver em curso termina no servidor, sem ninguém olhando.
        O andamento cômodo a cômodo aparece no card da etapa 1.
      -->
      @if (store.published()) {
        <app-tour-published />
      } @else {
        @switch (store.step()) {
          @case (1) { <app-tour-step-images /> }
          @case (2) { <app-tour-step-ordering /> }
          @case (3) { <app-tour-step-passages /> }
          @case (4) { <app-tour-step-info /> }
        }
      }
    </div>

    <div class="tw-shell__foot">
      <!--
        Falha ao publicar mora aqui, e não dentro da tela de sucesso.
        `published()` só vira true depois de o tour existir, então a tela de
        sucesso nunca monta quando a publicação falha — o aviso ficava
        inalcançável justamente no único caso em que ele tem o que dizer. Junto
        da barra fixa, aparece na altura do botão que a pessoa acabou de apertar.
      -->
      @if (store.publishError(); as erro) {
        <p class="tw-shell__error" role="alert">{{ erro | translate }}</p>
      }

      <!--
        A barra some por completo no estado publicado: não há mais nada a
        avançar, e as ações de lá (copiar link, criar outro) pertencem ao próprio
        conteúdo.
      -->
      @if (!store.published()) {
        <app-wizard-actions />
      }
    </div>
  </div>
</ion-content>
