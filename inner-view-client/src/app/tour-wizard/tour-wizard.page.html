<ion-content [fullscreen]="true" [scrollEvents]="true" (ionScroll)="onScroll($event)">
  <app-header backHref="/home" [pageTitle]="'TOUR_WIZARD.COMMON.TITLE' | translate"></app-header>

  <div class="tw-shell">
    <app-wizard-stepper />

    <div class="tw-body">
      @if (store.published()) {
        <app-tour-published />
      } @else {
        @switch (store.step()) {
          @case (1) { <app-tour-step-images /> }
          @case (2) { <app-tour-step-hotspots /> }
          @case (3) { <app-tour-step-info /> }
        }
      }
    </div>

    <!--
      A barra some por completo no estado publicado: não há mais nada a avançar,
      e as ações de lá (copiar link, criar outro) pertencem ao próprio conteúdo.
    -->
    @if (!store.published()) {
      <app-wizard-actions />
    }
  </div>
</ion-content>
