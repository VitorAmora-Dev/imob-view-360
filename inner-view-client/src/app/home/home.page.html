<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inner Views</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openLanguagePopover($event)">
        <ion-icon name="globe-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="['/profile']">
        <ion-icon name="person-circle-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="signout()" color="medium">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [placeholder]="'HOME.SEARCH_PLACEHOLDER' | translate"
      (ionInput)="onSearch($event)"
      animated="true">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-popover
  [isOpen]="isLangPopoverOpen"
  [event]="langPopoverEvent"
  (didDismiss)="isLangPopoverOpen = false">
  <ng-template>
    <ion-list lines="none">
      <ion-item button [detail]="false" (click)="selectLang('pt')">
        <ion-label>Português</ion-label>
        @if (languageService.currentLang() === 'pt') {
          <ion-icon name="checkmark-outline" slot="end"></ion-icon>
        }
      </ion-item>
      <ion-item button [detail]="false" (click)="selectLang('en')">
        <ion-label>English</ion-label>
        @if (languageService.currentLang() === 'en') {
          <ion-icon name="checkmark-outline" slot="end"></ion-icon>
        }
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>

<ion-content [fullscreen]="true">
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/upload">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <app-inner-view-list [items]="filteredItems"></app-inner-view-list>
</ion-content>
