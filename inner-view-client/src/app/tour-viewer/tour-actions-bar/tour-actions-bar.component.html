<!--
  No imersivo sobra UM botão, e é por `@if` e não por CSS: os outros dois
  precisam sair da ordem de tabulação, não só da vista. Escondidos por opacidade
  eles continuariam recebendo Tab, e o teclado passearia por "Editar" e
  "Compartilhar" invisíveis antes de chegar ao único controle na tela.
-->
<div class="tv-actions__grid">
  @if (chromeVisible() && canEdit()) {
    <button
      type="button"
      class="tv-actions__button tv-actions__button--edit"
      [attr.title]="'TOUR_VIEWER.ACTIONS.EDIT_LONG' | translate"
      (click)="editRequested.emit()">
      <ion-icon name="pencil-outline" aria-hidden="true"></ion-icon>
      <span>{{ 'TOUR_VIEWER.ACTIONS.EDIT' | translate }}</span>
    </button>
  }

  <button
    type="button"
    class="tv-actions__button tv-actions__button--visibility"
    [attr.aria-label]="chaveDaVisibilidade() | translate"
    [attr.title]="chaveDaVisibilidade() | translate"
    (click)="visibilityToggled.emit()">
    <ion-icon [name]="iconeDaVisibilidade()" aria-hidden="true"></ion-icon>
    @if (chromeVisible()) {
      <span>{{ chaveCurtaDaVisibilidade() | translate }}</span>
    }
  </button>

  <!--
    Sai no imersivo como editar e compartilhar, e NÃO fica junto do de ocultar.
    O imersivo continua com um botão só — a regra que o comentário do topo
    explica —, e o caminho de volta do modo deitado é o de sempre: o toque que
    devolve a interface traz este botão junto.

    Só existe no celular; o corte de largura está no SCSS, no mesmo @media que
    governa o giro do palco.
  -->
  @if (chromeVisible()) {
    <button
      type="button"
      class="tv-actions__button tv-actions__button--orientation"
      [attr.aria-label]="chaveDaOrientacao() | translate"
      [attr.title]="chaveDaOrientacao() | translate"
      (click)="orientationToggled.emit()">
      <ion-icon [name]="iconeDaOrientacao()" aria-hidden="true"></ion-icon>
      <span>{{ chaveCurtaDaOrientacao() | translate }}</span>
    </button>
  }

  @if (chromeVisible() && podeCompartilhar()) {
    <button
      type="button"
      class="tv-actions__button tv-actions__button--share"
      [attr.title]="'TOUR_VIEWER.ACTIONS.SHARE_LONG' | translate"
      (click)="shareRequested.emit()">
      <ion-icon name="share-social-outline" aria-hidden="true"></ion-icon>
      <span>{{ 'TOUR_VIEWER.ACTIONS.SHARE' | translate }}</span>
    </button>
  }
</div>
