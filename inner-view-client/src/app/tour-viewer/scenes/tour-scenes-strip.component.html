<!--
  Uma marcação só para a faixa do celular e o rail do desktop. O que troca é a
  moldura, e é o CSS que troca: um `@media` não pode dar dois resultados
  diferentes, ao contrário de um `@if` sobre `matchMedia`, que abriria a porta
  para os dois layouts existirem ao mesmo tempo no DOM.

  Os dois botões do cabeçalho seguem a mesma regra. Ambos estão sempre no HTML,
  e o que sobra em cada largura é `display: none` — que, ao contrário de
  `visibility` ou `opacity`, TIRA o botão da ordem de tabulação. Sem isso, o Tab
  no celular pararia em "Recolher", um controle que só existe no desktop.
-->
<div class="tv-cenas" [class.tv-cenas--recolhido]="recolhido()">
  <header class="tv-cenas__head">
    <h2 class="tv-cenas__titulo">
      {{ 'TOUR_VIEWER.SCENES.CAPTION' | translate }}<!--
        A contagem só aparece no rail do desktop, onde o cabeçalho é a única
        coisa que sobra quando ele está recolhido — ali, "CENAS · 6" é o que
        diz o que se está escondendo. Comentário colado por causa do
        `white-space` do separador: uma quebra de linha aqui viraria um espaço
        antes do "·".
      --><span class="tv-cenas__contagem"> · {{ cenas().length }}</span>
    </h2>

    <button type="button" class="tv-cenas__acao tv-cenas__acao--faixa" (click)="verTodas()">
      {{ 'TOUR_VIEWER.SCENES.SEE_ALL' | translate }}
    </button>

    <!--
      `aria-expanded` no botão, e não em cima do trilho: quem é anunciado é o
      controle, e é ele que o leitor de tela encontra. O rótulo já troca junto
      ("Recolher" / "Expandir"), mas o atributo é o que faz a mudança chegar sem
      reler a tela.
    -->
    <button
      type="button"
      class="tv-cenas__acao tv-cenas__acao--rail"
      [attr.aria-expanded]="!recolhido()"
      (click)="alternarRail()">
      {{ (recolhido() ? 'TOUR_VIEWER.SCENES.EXPAND' : 'TOUR_VIEWER.SCENES.COLLAPSE') | translate }}
      <svg class="tv-cenas__chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path
          d="M4 10l4-4 4 4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </header>

  <!--
    A TV-12 fecha o contrato de acessibilidade do handoff: a faixa é um
    `tablist`, cada cena é uma `tab` e as setas fazem foco itinerante. O palco é
    o painel visual controlado por este conjunto, mesmo estando fora do
    componente por causa da camada Three.js.
  -->
  <ul
    class="tv-cenas__trilho"
    role="tablist"
    [attr.aria-label]="'TOUR_VIEWER.SCENES.SHEET_TITLE' | translate">
    @for (cena of cenas(); track cena.id; let i = $index) {
      <li class="tv-cenas__vaga" role="presentation">
        <button
          type="button"
          class="tv-cenas__item"
          role="tab"
          [class.is-carregando]="!miniatura(cena)"
          [attr.data-cena]="cena.id"
          [attr.aria-selected]="cena.id === atualId()"
          [attr.tabindex]="cena.id === atualId() || (!atualId() && i === 0) ? 0 : -1"
          [title]="cena.name"
          (click)="escolher(cena)"
          (keydown)="aoTeclar($event, i)">
          <!--
            O `<img>` fica sempre no DOM, sem `@if`: enquanto o `blob:` não
            chega, `miniatura()` devolve `undefined`, o Angular não escreve o
            atributo `src`, e um `<img>` sem `src` não rende ícone de imagem
            quebrada — só deixa aparecer o fundo do botão, que é o estado de
            carregando.
          -->
          <img class="tv-cenas__thumb" [src]="miniatura(cena)" alt="">
          <span class="tv-cenas__nome">{{ cena.name }}</span>
        </button>
      </li>
    }
  </ul>
</div>
