<button
  type="button"
  [class.is-hidden]="!chromeVisible()"
  [attr.inert]="!chromeVisible() ? '' : null"
  [attr.aria-label]="'TOUR_VIEWER.SCENES.OPEN_LIST' | translate"
  (click)="openScenes.emit()">
  <span class="tv-pill__dot" aria-hidden="true"></span>
  <span class="tv-pill__name">{{ sceneName() }}</span>
  <ion-icon name="chevron-down-outline" aria-hidden="true"></ion-icon>
</button>
