<ion-content class="ion-padding">
  <app-header></app-header>

  <div class="login-container">
    <div class="login-logo">
      <h1>Entrar</h1>
      <p class="brand-tagline">Tour virtual de imóveis 360°</p>
    </div>

    <form (ngSubmit)="submit()">
      <ion-input
        label="E-mail"
        labelPlacement="floating"
        fill="outline"
        type="email"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        required>
      </ion-input>

      <ion-input
        label="Senha"
        labelPlacement="floating"
        fill="outline"
        type="password"
        [(ngModel)]="password"
        name="password"
        autocomplete="current-password"
        required>
      </ion-input>

      <ion-button
        expand="block"
        type="submit"
        class="login-btn"
        [disabled]="loading || !email || !password">
        @if (loading) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        }
        Entrar
      </ion-button>
    </form>

    <ion-button fill="clear" expand="block" routerLink="/register">
      Não tem uma conta? Criar conta
    </ion-button>
  </div>
</ion-content>

<ion-toast
  [isOpen]="showToast"
  [message]="errorMessage"
  [duration]="3000"
  color="danger"
  position="bottom"
  (didDismiss)="showToast = false">
</ion-toast>
