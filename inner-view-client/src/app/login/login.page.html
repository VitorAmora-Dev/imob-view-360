<ion-content [fullscreen]="true" class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <app-brand-logo kind="horizontal"></app-brand-logo>
      </div>

      <header class="login-intro">
        <h1 id="login-title">{{ 'AUTH.LOGIN_TITLE' | translate }}</h1>
        <p>{{ 'AUTH.TAGLINE' | translate }}</p>
      </header>

      <form class="login-form" (ngSubmit)="submit()">
        <ion-input
          [label]="'AUTH.EMAIL_LABEL' | translate"
          labelPlacement="floating"
          fill="outline"
          type="email"
          inputmode="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required>
        </ion-input>

        <ion-input
          [label]="'AUTH.PASSWORD_LABEL' | translate"
          labelPlacement="floating"
          fill="outline"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required>
        </ion-input>

        @if (errorMessage) {
          <p class="login-error" role="alert">{{ errorMessage }}</p>
        }

        <ion-button
          expand="block"
          type="submit"
          class="login-btn"
          [attr.aria-busy]="loading ? 'true' : null"
          [disabled]="loading || !email || !password">
          {{ (loading ? 'AUTH.SUBMITTING' : 'AUTH.SUBMIT') | translate }}
        </ion-button>
      </form>

      <ion-button
        class="login-register"
        fill="clear"
        expand="block"
        routerLink="/register">
        {{ 'AUTH.NO_ACCOUNT' | translate }}
      </ion-button>
    </section>
  </main>
</ion-content>
