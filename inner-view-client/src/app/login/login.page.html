<ion-content [fullscreen]="true">
  <div class="login-shell">
    <div class="login-visual">
      <!--
        A coruja 3D custa three.js mais um modelo de 4,9 MB. `on viewport`
        amarra esse download a ela estar VISIVEL: abaixo de 744px o painel
        inteiro e' display:none, o placeholder nunca entra em viewport, e o
        celular nao baixa nada disso -- fica com a coruja chapada, que ja
        inclina a cabeca sozinha. Acima de 744px o painel nasce visivel e o
        3D dispara na hora, sem o formulario esperar por ele.
      -->
      <div class="login-visual__mark">
        @defer (on viewport) {
          <app-owl-loader color="#FFFFFF" />
        } @placeholder {
          <app-brand-logo kind="symbol" tone="white" [decorative]="true"></app-brand-logo>
        }
      </div>

      <app-brand-logo
        class="login-visual__wordmark"
        kind="horizontal"
        tone="white"
        [decorative]="true">
      </app-brand-logo>
      <p class="login-visual__tagline">{{ 'AUTH.TAGLINE' | translate }}</p>
    </div>

    <div class="login-form-panel">
      <div class="auth-intro">
        <app-brand-logo kind="symbol" [decorative]="true"></app-brand-logo>
        <h1>{{ 'AUTH.LOGIN_TITLE' | translate }}</h1>
        <p class="brand-tagline">{{ 'AUTH.TAGLINE' | translate }}</p>
      </div>

      <form (ngSubmit)="submit()">
        <ion-input
          [label]="'AUTH.EMAIL_LABEL' | translate"
          labelPlacement="floating"
          fill="outline"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required>
        </ion-input>

        <ion-input
          [label]="'AUTH.PASSWORD_LABEL' | translate"
          labelPlacement="floating"
          fill="outline"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required>
        </ion-input>

        <ion-button
          expand="block"
          type="submit"
          class="login-btn"
          [disabled]="loading || !email || !password">
          @if (loading) {
            <ion-spinner name="crescent" slot="start"></ion-spinner>
          }
          {{ 'AUTH.SUBMIT' | translate }}
        </ion-button>
      </form>

      <ion-button fill="clear" expand="block" routerLink="/register">
        {{ 'AUTH.NO_ACCOUNT' | translate }}
      </ion-button>
    </div>
  </div>
</ion-content>

<ion-toast
  [isOpen]="showToast"
  [message]="errorMessage"
  [duration]="3000"
  color="danger"
  position="bottom"
  (didDismiss)="showToast = false">
</ion-toast>
