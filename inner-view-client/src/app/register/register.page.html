<ion-content class="ion-padding">
  <app-header backHref="/login"></app-header>

  <div class="form-shell">
    <div class="auth-intro">
      <app-brand-logo kind="symbol" [decorative]="true"></app-brand-logo>
      <h1>Criar conta</h1>
      <p class="brand-tagline">Cadastre sua imobiliária</p>
    </div>

    <form (ngSubmit)="submit()">
      <section class="form-section">
        <h3>Imobiliária</h3>

        <ion-input
          label="Nome da imobiliária *"
          labelPlacement="floating"
          fill="outline"
          type="text"
          [(ngModel)]="agencyName"
          name="agencyName"
          autocomplete="organization"
          required>
        </ion-input>

        <ion-input
          label="CNPJ"
          labelPlacement="floating"
          fill="outline"
          type="text"
          [(ngModel)]="cnpj"
          name="cnpj"
          placeholder="12.345.678/0001-90">
        </ion-input>

        <ion-input
          label="E-mail da imobiliária"
          labelPlacement="floating"
          fill="outline"
          type="email"
          [(ngModel)]="agencyEmail"
          name="agencyEmail">
        </ion-input>

        <ion-input
          label="Telefone"
          labelPlacement="floating"
          fill="outline"
          type="tel"
          [(ngModel)]="phone"
          name="phone"
          autocomplete="tel">
        </ion-input>
      </section>

      <section class="form-section">
        <h3>Administrador</h3>

        <ion-input
          label="Nome completo *"
          labelPlacement="floating"
          fill="outline"
          type="text"
          [(ngModel)]="name"
          name="name"
          autocomplete="name"
          required>
        </ion-input>

        <ion-input
          label="E-mail *"
          labelPlacement="floating"
          fill="outline"
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required>
        </ion-input>

        <ion-input
          label="Senha *"
          labelPlacement="floating"
          fill="outline"
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="new-password"
          helperText="Mínimo de 6 caracteres"
          required>
        </ion-input>

        <ion-input
          label="Confirmar senha *"
          labelPlacement="floating"
          fill="outline"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          autocomplete="new-password"
          errorText="As senhas não coincidem"
          [class.ion-touched]="passwordMismatch"
          [class.ion-invalid]="passwordMismatch"
          required>
        </ion-input>
      </section>

      <ion-button
        expand="block"
        type="submit"
        class="ion-margin-top"
        [disabled]="loading || !formValid">
        @if (loading) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        }
        Criar conta
      </ion-button>
    </form>

    <ion-button fill="clear" expand="block" routerLink="/login">
      Já tem uma conta? Entrar
    </ion-button>
  </div>
</ion-content>

<ion-toast
  [isOpen]="showToast"
  [message]="errorMessage"
  [duration]="3000"
  color="danger"
  position="bottom"
  (didDismiss)="showToast = false">
</ion-toast>
