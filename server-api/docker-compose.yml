services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # 5433 no host de propósito — ver o comentário de DB_PORT no .env.example.
      # O default vale quando DB_PORT não está definida; dentro da rede do compose
      # o serviço api continua falando com db:5432, que não muda.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - '${API_PORT}:3000'
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Sem esta linha a montagem por IA fica inerte no container: a API sobe,
      # aceita a captura e dispensa todo panorama em SKIPPED. O `:-` mantém o
      # compose subindo sem a chave — o serviço já é opcional por construção.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # O glibc sobe sozinho o limiar de `mmap` conforme vê blocos grandes
      # sendo liberados, e a partir daí os rasters da montagem saem da arena —
      # que só encolhe pelo topo. Medido em container de 512 MB, três montagens
      # seguidas: sem esta linha o pico dobra (209 para 400 MB) e não volta.
      # Precisa ser variável de ambiente: o glibc a lê antes do processo subir.
      # Ver src/shared/memoria.ts.
      MALLOC_MMAP_THRESHOLD_: '1048576'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
